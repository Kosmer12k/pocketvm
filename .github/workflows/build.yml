name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # Создаем ZIP-архив с APK внутри с помощью Python
      - name: Create ZIP archive with APK
        run: |
          python3 -c "
          import zipfile, os
          apk_path = 'app/build/outputs/apk/debug/app-debug.apk'
          zip_path = 'pocketvm-debug.zip'
          if os.path.exists(apk_path):
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
                  zipf.write(apk_path, os.path.basename(apk_path))
              print('Архив успешно создан!')
          else:
              print('Ошибка: APK не найден!')
              exit(1)
          "

      # Загружаем созданный ZIP-архив в артефакты сборки GitHub
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketvm-app-archive
          path: pocketvm-debug.zip
          
